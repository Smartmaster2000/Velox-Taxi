<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velox Admin - Vloot Beheer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { padding: 24px; text-align: center; }
        .main-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; background: transparent; border: none; color: #888; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: #00f5d4; border-bottom: 3px solid #00f5d4; }
        .tab-btn:hover:not(.active) { color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .driver-list, .ride-list, .complaint-list { list-style: none; max-height: 500px; overflow-y: auto; }
        .driver-item, .complaint-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--glass-border); }
        .complaint-item { flex-direction: column; align-items: flex-start; gap: 10px; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .status-online { background: rgba(0, 245, 212, 0.1); color: var(--secondary); }
        .status-busy { background: rgba(255, 188, 0, 0.1); color: #ffbc00; }
        .status-offline { background: rgba(255, 68, 68, 0.1); color: #ff4444; }
        .status-new { background: rgba(255, 68, 68, 0.2); color: #ff4444; }
        .status-reviewed { background: rgba(255, 188, 0, 0.2); color: #ffbc00; }
        .status-resolved { background: rgba(0, 245, 212, 0.2); color: #00f5d4; }
        
        #map { height: 450px; width: 100%; border-radius: 16px; margin-bottom: 20px; }
        .chart-container { background: #1a1a3a; padding: 20px; border-radius: 16px; height: 350px; border: 1px solid #333; margin-bottom: 20px; }
        
        table.rides-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        table.rides-table th, table.rides-table td { padding: 12px; border-bottom: 1px solid var(--glass-border); }
        table.rides-table tr:hover { background: rgba(255, 255, 255, 0.02); cursor: pointer; }
        table.rides-table th { color: var(--text-muted); font-weight: 600; }
        
        .mapboxgl-popup-content { background: #1a1a2e; color: white; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip { border-top-color: #1a1a2e; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        
        #error-banner { display: none; background: #ff4444; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container animate-fade">
        <header style="margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h1 style="font-weight: 800; letter-spacing: -1px;">VLOOT <span style="color: var(--primary);">BEHEER</span></h1>
            </a>
            <div style="display: flex; gap: 20px; align-items: center;">
                <span id="admin-badge" style="background: rgba(0, 245, 212, 0.2); color: #00f5d4; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase;">ADMIN</span>
                <button class="btn glass" onclick="handleLogout()">Uitloggen</button>
            </div>
        </header>
        
        <div id="error-banner"></div>

        <section class="stats-grid">
            <div class="stat-card glass">
                <div style="color: var(--text-muted); font-size: 0.9rem;">🟢 Actieve Chauffeurs</div>
                <div id="stat-drivers" style="font-size: 1.8rem; font-weight: 800; color: #00f5d4; margin-top: 8px;">0</div>
            </div>
            <div class="stat-card glass">
                <div style="color: var(--text-muted); font-size: 0.9rem;">🟡 Actieve Verzoeken</div>
                <div id="stat-requests" style="font-size: 1.8rem; font-weight: 800; color: #ffbc00; margin-top: 8px;">0</div>
            </div>
            <div class="stat-card glass">
                <div style="color: var(--text-muted); font-size: 0.9rem;">🟣 Actieve Ritten</div>
                <div id="stat-active" style="font-size: 1.8rem; font-weight: 800; color: #9d4edd; margin-top: 8px;">0</div>
            </div>
            <div class="stat-card glass" style="border: 1px solid rgba(0, 245, 212, 0.3);">
                <div style="color: #00f5d4; font-size: 0.9rem; font-weight: bold;">💰 Totale Omzet (Vandaag)</div>
                <div id="stat-revenue" style="font-size: 1.8rem; font-weight: 800; color: #fff; margin-top: 8px;">€0.00</div>
            </div>
        </section>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
            <button class="tab-btn" onclick="switchTab('map-tab')">Live Kaart</button>
            <button class="tab-btn" onclick="switchTab('complaints-tab')">Klachten</button>
        </div>

        <div class="main-layout">
            <section>
                <!-- Dashboard Tab -->
                <div id="dashboard" class="tab-content active">
                    <h2 style="margin-bottom: 20px;">Dagelijkse Workflow</h2>
                    <div class="chart-container">
                        <canvas id="workflowChart"></canvas>
                    </div>

                    <h2 style="margin-bottom: 20px; margin-top: 40px;">Ritten Overzicht</h2>
                    <div class="glass" style="padding: 10px; overflow-x: auto;">
                        <table class="rides-table">
                            <thead>
                                <tr>
                                    <th>Rit ID</th>
                                    <th>Datum</th>
                                    <th>Passagier</th>
                                    <th>Chauffeur</th>
                                    <th>Status</th>
                                    <th>Fare (100%)</th>
                                    <th style="color: #00f5d4;">Fee (8%)</th>
                                    <th style="color: #ffbc00;">Netto (92%)</th>
                                </tr>
                            </thead>
                            <tbody id="ride-list"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Live Map Tab -->
                <div id="map-tab" class="tab-content">
                    <h2 style="margin-bottom: 20px;">Live Fleet Kaart</h2>
                    <div id="map" class="glass"></div>
                </div>

                <!-- Complaints Tab -->
                <div id="complaints-tab" class="tab-content">
                    <h2 style="margin-bottom: 20px;">Klachten Systeem</h2>
                    <div class="glass" style="padding: 20px;">
                        <ul class="complaint-list" id="complaints-list">
                            <li style="color: #888;">Laden...</li>
                        </ul>
                    </div>
                </div>
            </section>

            <!-- Sidebar (always visible) -->
            <aside>
                <h2 style="margin-bottom: 20px;">Chauffeurs</h2>
                <div class="glass" style="padding: 10px;">
                    <ul class="driver-list" id="driver-list"></ul>
                </div>
            </aside>
        </div>
    </div>

    <!-- Modals -->
    <div id="details-modal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div class="glass" style="padding: 30px; border-radius: 16px; max-width: 500px; width: 100%;" id="modal-content"></div>
    </div>

    <script src="app.js"></script>
    <script>
        let map;
        let driverMarkers = {};
        let workflowChartInstance = null;

        function showError(message) {
            const banner = document.getElementById('error-banner');
            banner.style.display = 'block';
            banner.innerText = "Error: " + message;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const user = getUserFromStorage();
            
            // ✅ FIXED: Allow access ONLY if role is exactly 'admin'
            if (user && user.role === 'admin') {
                // Ensure UI reflects the Admin state immediately
                document.getElementById('admin-badge').innerText = (user.name || 'Admin').toUpperCase() + ' • ADMIN';
                
                await loadConfig();
                initMap();
                await loadMetricsAndRides();
                await loadDrivers();        // ← Loads drivers (ONLY ONCE)
                await loadMetrics();        // ← ✅ ADD THIS
                await loadActiveRides();    // ← ✅ ADD THIS
                await loadComplaints();
                subscribeToRealtimeEvents();
                
                // ✅ Polling fallback — refreshes every 10s
                setInterval(async () => {
                    await loadMetricsAndRides();
                    await loadDrivers();
                }, 10000);
            } else {
                alert("Access Denied: You are not recognized as an Admin.");
                window.location.href = '/index.html';
            }
        });
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            if (tabId === 'map-tab' && map) map.resize();
        }

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                if (config.mapboxToken) mapboxgl.accessToken = config.mapboxToken;
                if (config.supabaseUrl && config.supabaseAnonKey && typeof supabase !== 'undefined') {
                    window.supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

                    // ✅ Authenticate the Realtime WebSocket so RLS delivers events
                    const user = getUserFromStorage();
                    const session = user?.session;
                    if (session?.access_token && session?.refresh_token) {
                        await window.supabaseClient.auth.setSession({
                            access_token: session.access_token,
                            refresh_token: session.refresh_token
                        });
                    }
                }
            } catch (err) { console.error('Config error:', err); }
        }

        function initMap() {
            map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/dark-v11',
                center: [4.8952, 52.3702], // Amsterdam
                zoom: 12
            });
        }

        async function loadMetricsAndRides() {
            if (!window.supabaseClient) return;
            try {
                const { data: rides, error } = await window.supabaseClient
                    .from('ride_details_with_users')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(200);

                if (error) {
                    console.error("Supabase Error Details:", error);
                    showError(error.message + " (Check RLS Policies)");
                    return;
                }

                let requests = 0, active = 0, todayRevenue = 0;
                
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                // For chart
                const hourlyData = { requested: {}, accepted: {}, completed: {} };
                for(let i=0; i<24; i++) {
                    hourlyData.requested[i] = 0; hourlyData.accepted[i] = 0; hourlyData.completed[i] = 0;
                }

                const list = document.getElementById('ride-list');
                list.innerHTML = '';

                if (rides) {
                    rides.forEach((r, idx) => {
                        const price = parseFloat(r.price || 0);
                        const rideDate = new Date(r.created_at);
                        const isToday = rideDate >= today;

                        if (r.status === 'requested') requests++;
                        if (r.status === 'accepted' || r.status === 'enroute') active++;
                        if (r.status === 'completed' && isToday) todayRevenue += price;

                        if (isToday) {
                            const hour = rideDate.getHours();
                            if (r.status === 'requested') hourlyData.requested[hour]++;
                            else if (r.status === 'completed') hourlyData.completed[hour]++;
                            else if (r.status === 'accepted' || r.status === 'enroute') hourlyData.accepted[hour]++;
                        }

                        if (idx < 50) { // Only show last 50 in table
                            const fare = price;
                            const fee = parseFloat(r.platform_fee || (fare * 0.08));
                            const net = parseFloat(r.net_earnings || (fare - fee));
                            
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td style="font-family: monospace;">${r.id.substring(0,8)}</td>
                                <td>${rideDate.toLocaleDateString()} ${rideDate.getHours()}:${rideDate.getMinutes().toString().padStart(2,'0')}</td>
                                <td>${r.passenger_name || 'Passagier'}</td>
                                <td>${r.driver_name || '<span style="color:var(--text-muted)">N/A</span>'}</td>
                                <td><span class="status-badge status-${r.status === 'requested' ? 'offline' : 'online'}">${r.status}</span></td>
                                <td>€${fare.toFixed(2)}</td>
                                <td style="color: #00f5d4; font-weight: bold;">€${fee.toFixed(2)}</td>
                                <td style="color: #ffbc00; font-weight: bold;">€${net.toFixed(2)}</td>
                            `;
                            list.appendChild(tr);
                        }
                    });
                }

                document.getElementById('stat-requests').innerText = requests;
                document.getElementById('stat-active').innerText = active;
                document.getElementById('stat-revenue').innerText = `€${todayRevenue.toFixed(2)}`;

                updateChart(hourlyData);

            } catch (err) { console.error(err); }
        }

        function updateChart(data) {
            const ctx = document.getElementById('workflowChart').getContext('2d');
            const labels = Array.from({length: 24}, (_, i) => `${i}:00`);
            const dsRequested = labels.map((_, i) => data.requested[i]);
            const dsAccepted = labels.map((_, i) => data.accepted[i]);
            const dsCompleted = labels.map((_, i) => data.completed[i]);

            if (workflowChartInstance) workflowChartInstance.destroy();

            workflowChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Requested', data: dsRequested, backgroundColor: '#ff4444' },
                        { label: 'Accepted/Enroute', data: dsAccepted, backgroundColor: '#ffbc00' },
                        { label: 'Completed', data: dsCompleted, backgroundColor: '#00f5d4' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, grid: { color: '#333' }, ticks: { color: '#888' } },
                        y: { stacked: true, grid: { color: '#333' }, ticks: { color: '#888', stepSize: 1 } }
                    },
                    plugins: { legend: { labels: { color: '#fff' } } }
                }
            });
        }

        async function loadDrivers() {
            if (!window.supabaseClient) return;
            try {
                const { data: drivers, error } = await window.supabaseClient.from('drivers').select('*');
                if (error) {
                    showError(error.message);
                    return;
                }
                const { data: profiles } = await window.supabaseClient.from('profiles').select('id, name');
                const profileMap = {};
                if (profiles) profiles.forEach(p => profileMap[p.id] = p.name);

                let onlineCount = 0;
                const list = document.getElementById('driver-list');
                list.innerHTML = '';

                if (drivers) {
                    drivers.forEach(d => {
                        const name = profileMap[d.id] || 'Chauffeur';
                        if (d.status === 'online' || d.status === 'busy') onlineCount++;
                        
                        updateDriverMarker(d, name);

                        const li = document.createElement('li');
                        li.className = 'driver-item';
                        li.innerHTML = `
                            <div style="flex-grow: 1;">
                                <div style="font-weight: 600;">${name}</div>
                                <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px;">🚗 ${d.vehicle_model || 'N/A'} • ${d.vehicle_plate || 'N/A'}</div>
                            </div>
                            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
                                <span class="status-badge status-${d.status}">${d.status}</span>
                            </div>
                        `;
                        list.appendChild(li);
                    });
                }

                document.getElementById('stat-drivers').innerText = onlineCount;
            } catch (err) { console.error(err); }
        }
        async function loadMetrics() {
            if (!window.supabaseClient) return;
            try {
                console.log('🔄 Loading metrics...');
                
                // ✅ Get active rides count
                const { data: activeRides, error: aErr } = await window.supabaseClient
                    .from('rides')
                    .select('id')
                    .in('status', ['requested', 'accepted', 'enroute']);

                if (aErr) {
                    console.error('❌ Error counting active rides:', aErr);
                    return;
                }

                // ✅ Update the stats card
                document.getElementById('active-rides-val').innerText = activeRides ? activeRides.length : 0;
                
                // ✅ Get today's revenue
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                const { data: completedRides, error: cErr } = await window.supabaseClient
                    .from('rides')
                    .select('price')
                    .eq('status', 'completed')
                    .gte('created_at', today.toISOString());

                if (cErr) {
                    console.error('❌ Error counting completed rides:', cErr);
                    return;
                }

                const revenue = completedRides ? completedRides.reduce((sum, r) => sum + parseFloat(r.price || 0), 0) : 0;
                document.getElementById('revenue-val').innerText = `€${revenue.toFixed(2)}`;
                
                // ✅ Update completed rides count
                document.getElementById('completed-rides-val').innerText = completedRides ? completedRides.length : 0;
                
                console.log('✅ Metrics loaded:', {
                    activeRides: activeRides?.length || 0,
                    revenue: revenue,
                    completed: completedRides?.length || 0
                });
            } catch (err) {
                console.error('❌ Error in loadMetrics:', err);
            }
        }
        async function loadActiveRides() {
            if (!window.supabaseClient) return;
            try {
                console.log('🔄 Loading active rides...');
                
                const { data: rides, error } = await window.supabaseClient
                    .from('rides')
                    .select('*')
                    .in('status', ['requested', 'accepted', 'enroute'])
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('❌ Error loading rides:', error);
                    return;
                }

                console.log('✅ Active rides loaded:', rides?.length || 0);

                const list = document.getElementById('ride-list');
                if (!list) return;
                
                list.innerHTML = '';

                if (!rides || rides.length === 0) {
                    list.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#888; padding:20px;">Geen actieve ritten</td></tr>';
                    return;
                }

                rides.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.onclick = () => showRideDetails(r);
                    tr.innerHTML = `
                        <td style="font-family: monospace;">${r.id.substring(0,8)}</td>
                        <td>${r.passenger_id ? 'Passenger' : 'N/A'}</td>
                        <td>${r.driver_id ? 'Driver' : 'Unassigned'}</td>
                        <td>
                            <div style="font-size:0.8rem; max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">P: ${r.pickup_address || 'N/A'}</div>
                            <div style="font-size:0.8rem; max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">D: ${r.dropoff_address || 'N/A'}</div>
                        </td>
                        <td><span class="status-badge">${r.status}</span></td>
                        <td style="font-weight:bold; color:var(--secondary);">€${(r.price || 0).toFixed(2)}</td>
                    `;
                    list.appendChild(tr);
                });
            } catch (err) {
                console.error('❌ Error in loadActiveRides:', err);
            }
        }
        async function loadComplaints() {
            if (!window.supabaseClient) return;
            try {
                const { data: complaints, error } = await window.supabaseClient
                    .from('complaints')
                    .select('*, passenger:profiles!complaints_passenger_id_fkey(name), driver:profiles!complaints_driver_id_fkey(name)')
                    .order('created_at', { ascending: false });

                if (error) return; // Suppress for now to avoid multiple banners

                const list = document.getElementById('complaints-list');
                list.innerHTML = '';
                
                if (!complaints || complaints.length === 0) {
                    list.innerHTML = '<li style="color:#888;">Geen klachten gevonden.</li>';
                    return;
                }

                complaints.forEach(c => {
                    const li = document.createElement('li');
                    li.className = 'complaint-item';
                    
                    li.innerHTML = `
                        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px;">
                            <div>
                                <strong style="color: #ff4444;">Rit #${c.ride_id.substring(0,8)}</strong>
                                <span style="font-size: 0.8rem; color: #888; margin-left: 10px;">${new Date(c.created_at).toLocaleString()}</span>
                            </div>
                            <span class="status-badge status-${c.status}">${c.status}</span>
                        </div>
                        <div style="font-size: 0.9rem; color: #ccc; margin-bottom: 10px;">
                            <strong>Van:</strong> ${c.passenger?.name || 'Onbekend'}<br>
                            <strong>Over:</strong> ${c.driver?.name || 'Geen chauffeur'}<br>
                        </div>
                        <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; font-style: italic; font-size: 0.95rem; width: 100%;">
                            "${c.complaint_text}"
                        </div>
                        <div class="btn-group" style="width: 100%; margin-top: 10px;">
                            <button class="btn glass" style="font-size: 0.8rem; flex: 1; border-color: #ffbc00;" onclick="updateComplaint('${c.id}', 'reviewed')">Markeer als Bekeken</button>
                            <button class="btn glass" style="font-size: 0.8rem; flex: 1; border-color: #00f5d4;" onclick="updateComplaint('${c.id}', 'resolved')">Markeer als Opgelost</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            } catch (err) { console.error('Complaints error:', err); }
        }

        async function updateComplaint(id, status) {
            try {
                const { error } = await window.supabaseClient.from('complaints').update({ status }).eq('id', id);
                if (error) throw error;
                loadComplaints();
            } catch (e) { alert("Error updating complaint"); }
        }

        function updateDriverMarker(driver, driverName) {
            if (!driver.current_lat || !driver.current_lng) return;

            const coords = [parseFloat(driver.current_lng), parseFloat(driver.current_lat)];
            let color = '#ff4444'; // offline
            if (driver.status === 'online') color = '#00f5d4';
            if (driver.status === 'busy') color = '#ffbc00';

            const popupHtml = `
                <div style="padding:5px;">
                    <div style="font-weight:bold; font-size:1.1rem; margin-bottom:5px;">${driverName || 'Chauffeur'}</div>
                    <div style="font-size:0.9rem; color:#aaa; margin-bottom:5px;">🚗 ${driver.vehicle_model || 'N/A'} (${driver.vehicle_plate || 'N/A'})</div>
                    <span class="status-badge status-${driver.status}">${driver.status}</span>
                </div>
            `;

            if (driverMarkers[driver.id]) {
                driverMarkers[driver.id].setLngLat(coords);
                driverMarkers[driver.id].getElement().querySelector('svg path').setAttribute('fill', color);
                driverMarkers[driver.id].getPopup().setHTML(popupHtml);
            } else {
                const popup = new mapboxgl.Popup({ offset: 25 }).setHTML(popupHtml);
                driverMarkers[driver.id] = new mapboxgl.Marker({ color })
                    .setLngLat(coords)
                    .setPopup(popup)
                    .addTo(map);
            }
        }

        function handleLogout() {
            localStorage.removeItem('velox_user');
            localStorage.removeItem('velox_session');
            window.location.href = '/index.html';
        }

        function subscribeToRealtimeEvents() {
            if (!window.supabaseClient) return;

            window.supabaseClient
                .channel('admin_fleet')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'rides' }, () => {
                    loadMetricsAndRides();
                    loadDrivers();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'drivers' }, () => {
                    loadDrivers();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'complaints' }, () => {
                    loadComplaints();
                })
                .subscribe();
        }
    </script>
</body>
</html>
